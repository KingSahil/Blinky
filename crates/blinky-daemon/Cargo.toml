[package]
name = "blinky-daemon"
version = "0.1.0"
edition = "2021"
authors = ["FeV"]
description = "High-performance headless Linux desktop automation and information daemon for Blinky"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
evdev = "0.12"
nix = { version = "0.29", features = ["user"] }
walkdir = "2.5"
tempfile = "3.17"
futures = "0.3"
async-trait = "0.1"
async-recursion = "1.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
