plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.technerds.blinky'
version = '1.0.0'

android {
  namespace "com.technerds.blinky.securesocket"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  testImplementation "junit:junit:4.13.2"
}
